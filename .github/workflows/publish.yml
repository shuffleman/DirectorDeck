name: Publish to Comfy Registry

# 推 v* tag 时自动发布到 Comfy Registry。
# 需要仓库 Secret：REGISTRY_ACCESS_TOKEN（Registry 个人访问令牌），
# 且 pyproject.toml 里 [tool.comfy].PublisherId 已与 Registry 账号一致。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
