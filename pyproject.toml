[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "director-deck"
version = "0.5.0"
description = "DirectorDeck - ComfyUI 短剧导演台节点库（链式分段生成 / 素材与音色覆盖 / 二采 / 合并）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "shuffleman" }]
keywords = ["comfyui", "minimax", "h3", "video", "storyboard", "director", "short-drama"]
dependencies = []

[project.urls]
Repository = "https://github.com/shuffleman/DirectorDeck"
"Bug Tracker" = "https://github.com/shuffleman/DirectorDeck/issues"

[tool.comfy]
PublisherId = "shuffleman"
DisplayName = "DirectorDeck - H3 短剧导演台"
Icon = "https://raw.githubusercontent.com/shuffleman/DirectorDeck/main/assets/directordeck-icon.svg"

[tool.setuptools]
include-package-data = true
packages = ["director_deck", "director_deck.core", "director_deck.adapters", "director_deck.nodes"]

[tool.setuptools.package-data]
director_deck = ["web/*.js"]
